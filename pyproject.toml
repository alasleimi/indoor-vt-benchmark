[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "indoor-vt-benchmark"
version = "0.1.0"
description = "Reproducible delay-only indoor localization and virtual-transmitter benchmark"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "shapely==2.1.2", "numba==0.62.1", "matplotlib==3.10.1"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.14", "pypdf>=5,<7"]

[project.scripts]
indoor-vt = "indoor_vt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/indoor_vt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
