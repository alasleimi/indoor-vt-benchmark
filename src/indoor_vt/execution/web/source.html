<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scientific source</title><style>body{margin:24px;font:14px system-ui;background:#f8fafb;color:#213540}pre{padding:24px;background:white;line-height:1.7;overflow:auto;font-size:12px}pre span{display:block}span:target{background:#fff0aa}pre a{color:#83959b;text-decoration:none}</style></head><body><a href="./">Experiment viewer</a><h1 id="title"></h1><p>Published implementation. Recorded outcomes retain their original provenance.</p><pre id="code">Loading…</pre><script type="module">import './site-runtime.js';try{const file=new URLSearchParams(location.search).get('file'),sources=await globalThis.VT_READ_SNAPSHOT('sources');if(!Object.hasOwn(sources,file))throw Error('Unknown source file');document.querySelector('#title').textContent=file;const host=document.querySelector('#code');host.textContent='';sources[file].split('\n').forEach((line,i)=>{const span=document.createElement('span');span.id='L'+(i+1);const a=document.createElement('a');a.href='#'+span.id;a.textContent=String(i+1).padStart(4)+'  ';span.append(a,document.createTextNode(line));host.append(span);});if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();}catch(e){document.querySelector('#code').textContent=e.message;}</script></body></html>
