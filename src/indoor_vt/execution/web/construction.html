<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concrete method construction</title><link rel="stylesheet" href="./style.css"><style>body{display:block;max-width:1100px;margin:30px auto;padding:24px}pre{white-space:pre;overflow:auto;padding:24px;background:white;line-height:1.65}</style></head><body><a href="./">Experiment viewer</a><h1>Concrete method construction</h1><p>Selected parameter values and injected dependencies. No reconstruction is executed.</p><div id="notes"></div><pre id="code">Loading…</pre><small id="receipt"></small><script type="module">import './site-runtime.js';try{const q=new URLSearchParams(location.search);const r=await fetch('./api/construction?'+q);const v=await r.json();if(!r.ok)throw Error(v.error);document.querySelector('#code').textContent=v.code;document.querySelector('#receipt').textContent='Receipt: '+v.receipt_id;v.notes.forEach(n=>{const p=document.createElement('p');p.textContent=n;document.querySelector('#notes').append(p);});}catch(e){document.querySelector('#code').textContent=e.message;}</script></body></html>
